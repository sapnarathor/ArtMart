{% extends "base.html" %}

{% block title %}
Contact | ArtMart
{% endblock %}

{% block content %}

<main class="simple-page">

    <h1>Contact Us</h1>

    <p>
        Have a question? Send us a message.
    </p>


    {% if message_sent %}

        <div class="success-message">

            Thank you!

            Your message has been received.

        </div>

    {% endif %}


    <form
        method="POST"
        action="/contact"
    >

        <input
            type="text"
            name="name"
            placeholder="Your Name"
            required
        >


        <input
            type="email"
            name="email"
            placeholder="Your Email"
            required
        >


        <textarea
            name="message"
            placeholder="Your Message"
            rows="6"
            required
        ></textarea>


        <button
            type="submit"
            class="primary-button"
        >
            Send Message
        </button>

    </form>

</main>

{% endblock %}
